[project]
name = "musicshelf"
version = "0.1.0"
description = "Build and organize your local music library from YouTube Music (CLI)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.47.0",
    "rich>=15.0.0",
    "typer>=0.27.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
musicshelf = "musicshelf.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
